# =============================================================================
# OpenTelemetry Collector — local pipeline.
# Receives OTLP (gRPC/HTTP) from services, exports traces to Jaeger and
# exposes metrics for Prometheus scrape on :8889.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 25

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: insert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
  # Collector self-metrics: 0.123+ replaced the legacy `metrics.address`
  # form with a readers list. We don't scrape collector-internal metrics
  # locally — app metrics go via the prometheus exporter on :8889 — so
  # leaving telemetry.metrics unset is fine.
