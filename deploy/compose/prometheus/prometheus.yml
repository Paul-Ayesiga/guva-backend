# Prometheus scrape config for the local stack.
# Mirrors the production approach: every service exposes /metrics on its
# admin port and labels itself with service.name/namespace via OTel attrs.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    environment: dev

# Alert rules live in a separate file so they're reviewable on their own.
# See deploy/compose/prometheus/alerts.yml.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]
        labels:
          component: gateway

  - job_name: keycloak
    # Keycloak 25+ exposes /metrics on the management interface
    # (port 9000 by default), not the main HTTP port.
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
        labels:
          component: identity-provider

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          component: message-broker

  - job_name: reference
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7070"]
        labels:
          service: reference
          component: example

  # Producer services that emit audit events. The audit/* metrics
  # exported from each tell us whether the audit_outbox drain Worker
  # is keeping up. See alerts.yml `audit-outbox` group.
  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7071"]
        labels:
          service: identity
          component: producer

  - job_name: audit
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7072"]
        labels:
          service: audit
          component: producer

  - job_name: apisix-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7073"]
        labels:
          service: apisix-adapter
          component: producer
