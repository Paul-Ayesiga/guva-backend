# Prometheus scrape config for the local stack.
# Mirrors the production approach: every service exposes /metrics on its
# admin port and labels itself with service.name/namespace via OTel attrs.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    environment: dev

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]
        labels:
          component: gateway

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:8080"]
        labels:
          component: identity-provider

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          component: message-broker

  - job_name: reference
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7070"]
        labels:
          service: reference
          component: example
