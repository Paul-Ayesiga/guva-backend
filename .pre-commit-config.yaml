# Run pre-commit hooks against staged files.
#   pip install pre-commit && pre-commit install
# CI executes the same hooks in `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      # go-vet is covered by the govet linter in .golangci.yml below;
      # avoid running it twice.
      - id: go-mod-tidy

  # golangci-lint is deliberately NOT a pre-commit hook:
  #   - the hook installs the linter from source via `go install ./...`,
  #     which keeps breaking against bleeding-edge Go (1.26+ rejects an
  #     invalid array length constant in old x/tools deps);
  #   - the .golangci.yml here uses v2 schema, and hook revs that bundle
  #     a v2 binary lag the actual releases.
  # The linter still runs through `make lint` locally and is the strict
  # gate in CI. Pre-commit stays fast and reliable.

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        # MD013 line-length, MD033 inline HTML, MD041 first-line-h1,
        # MD031 fenced-block-blanks (unfixable for indented fences
        # inside numbered lists without restructuring the doc).
        args: ["--disable", "MD013", "MD033", "MD041", "MD031", "--"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
