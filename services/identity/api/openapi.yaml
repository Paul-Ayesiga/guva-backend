openapi: 3.1.0
info:
  title: GUVA Identity Service
  version: 0.1.0
  description: |
    Owns the platform's scope catalogue and tracks consumer registrations.
    The Keycloak realm is the source of truth for credentials and scopes;
    this service holds the lifecycle metadata (who onboarded when).
servers:
  - url: http://localhost:7071
    description: Direct (bypasses APISIX)
  - url: http://localhost:8000/v1/identity
    description: Via APISIX gateway
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Service is alive }
  /readyz:
    get:
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /scopes:
    get:
      summary: List the platform's scope catalogue
      description: |
        Returns every scope the platform knows about with a human-readable
        description and a category. Consumers use this to figure out what
        access they should request when onboarding.
      responses:
        "200":
          description: Scope catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  scopes:
                    type: array
                    items: { $ref: '#/components/schemas/Scope' }
        "401": { description: Unauthorized }
        "403": { description: Insufficient scope }
  /consumers:
    post:
      summary: Register a new consumer
      description: |
        Records a consumer registration intent. A future iteration will
        also create the corresponding Keycloak client via the admin API;
        for now the response records the request and a Keycloak-side
        client must be provisioned separately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConsumerRequest' }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerRegistration' }
        "400": { description: Invalid request }
        "401": { description: Unauthorized }
        "403": { description: Insufficient scope }
  /consumers/{id}:
    get:
      summary: Read a consumer registration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumerRegistration' }
        "404": { description: Not found }
        "401": { description: Unauthorized }
        "403": { description: Insufficient scope }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Scope:
      type: object
      properties:
        name:        { type: string, example: "verify:citizen" }
        description: { type: string }
        category:    { type: string, example: "verification" }
    CreateConsumerRequest:
      type: object
      required: [agency_name, keycloak_client_id]
      properties:
        agency_name:        { type: string }
        contact_email:      { type: string, format: email }
        keycloak_client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
    ConsumerRegistration:
      allOf:
        - $ref: '#/components/schemas/CreateConsumerRequest'
        - type: object
          properties:
            id:         { type: string, format: uuid }
            status:     { type: string, enum: [pending, active, suspended, revoked] }
            created_at: { type: string, format: date-time }
