# =============================================================================
# GUVA — Local Development Stack
# =============================================================================
# This compose file stands up the full set of infrastructure dependencies that
# the platform's services require. It mirrors the production technology
# selections documented in guva-docs/06-infrastructure/19-recommended-tech-stack.md
# at developer-laptop scale: single broker, single replica, in-memory volumes
# acceptable, no TLS between containers.
#
# It is NOT a substitute for the Kubernetes deployment described in §13.3.
# =============================================================================

name: guva

x-restart: &restart
  restart: unless-stopped

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

networks:
  guva:
    name: guva

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
  keycloak-data:
  minio-data:
  prometheus-data:
  grafana-data:
  jaeger-data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary transactional store (§19.3, §8).
  # Image is built locally so we can install pgcrypto, pg_partman, pgaudit,
  # pg_stat_statements as required by §19.3.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    build:
      context: ./deploy/compose/postgres
    container_name: guva-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guva}
      POSTGRES_DB: ${POSTGRES_DB:-guva}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/compose/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pgaudit,pg_partman_bgw
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_statement=mod
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guva} -d ${POSTGRES_DB:-guva}"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Redis — cache + rate-limit counters (§17.2, §19.3).
  # ---------------------------------------------------------------------------
  redis:
    <<: *restart
    image: redis:8.0-alpine
    container_name: guva-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Kafka — event backbone (§12.1, §19.5). KRaft single-broker for local,
  # using the official Apache Kafka native image (GraalVM-compiled — small
  # footprint, sub-second cold start).
  #
  # External listener (localhost:9094) for host-side producers/consumers;
  # internal listener (kafka:9092) for in-cluster traffic. CLUSTER_ID is
  # auto-generated by the image on first boot and persisted in the data
  # volume — survives container restarts; only changes on `make reset`.
  # ---------------------------------------------------------------------------
  kafka:
    <<: *restart
    image: apache/kafka-native:4.3.0
    container_name: guva-kafka
    environment:
      # KRaft node identity
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-broker overrides — these defaults are 3 in stock Kafka
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      # Data directory inside the container
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # The native image strips out the JVM shell scripts (no kafka-broker-api-
    # versions.sh), so we use a TCP-probe healthcheck via the bash builtin
    # /dev/tcp — present in bash 4+, which the image ships with.
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' 2>/dev/null"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Apicurio Registry — event schema registry (§19.5).
  #
  # v3 consolidates onto a single image; the in-memory backend is selected by
  # APICURIO_STORAGE_KIND=mem. The REST surface moves to /apis/registry/v3/*
  # and the Quarkus health endpoints land at /q/health/{live,ready}.
  # ---------------------------------------------------------------------------
  apicurio:
    <<: *restart
    image: apicurio/apicurio-registry:3.0.6
    container_name: guva-apicurio
    environment:
      APICURIO_STORAGE_KIND: mem
      QUARKUS_HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # RabbitMQ — work-queue patterns (§12.1, §19.5).
  # ---------------------------------------------------------------------------
  rabbitmq:
    <<: *restart
    image: rabbitmq:4.0-management-alpine
    container_name: guva-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guva}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guva}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/compose/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./deploy/compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Keycloak — identity provider (§7.2.2, §19.4).
  # Runs in dev mode for local; production uses the Quarkus distribution in
  # cluster mode behind PostgreSQL (see infra repo).
  # ---------------------------------------------------------------------------
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: guva-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-guva}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-guva}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/compose/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\n\\n' >&3 && cat <&3 | head -1 | grep -q '200 OK'"]
      start_period: 60s
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Vault — secrets management (§10.4, §19.10). Dev mode only — production
  # uses HA mode with auto-unseal backed by an HSM.
  # ---------------------------------------------------------------------------
  vault:
    <<: *restart
    image: hashicorp/vault:1.19
    container_name: guva-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - ./deploy/compose/vault/policies:/vault/policies:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8200/v1/sys/health"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Kong Gateway — API perimeter (§7.2.1, §19.6). Declarative (DB-less) mode.
  # ---------------------------------------------------------------------------
  kong:
    <<: *restart
    image: kong/kong-gateway:3.9
    container_name: guva-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_PLUGINS: "bundled"
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin api
      - "8002:8002"   # admin gui
    volumes:
      - ./deploy/compose/kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "kong", "health"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (§19.3).
  # ---------------------------------------------------------------------------
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: guva-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-guva}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-guvaguva}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — telemetry pipeline (§19.9).
  # Receives OTLP from services; fans out to Prometheus and Jaeger.
  # ---------------------------------------------------------------------------
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: guva-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector's own metrics
      - "8889:8889"   # prometheus exporter (scraped by prometheus)
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Jaeger — distributed tracing (§19.9).
  #
  # Jaeger v2 ships under a new image name (`jaegertracing/jaeger`, not
  # `all-in-one`). It's a single OpenTelemetry-Collector-based binary with
  # OTLP receivers enabled by default — no COLLECTOR_OTLP_ENABLED needed.
  # Our otel-collector exports to jaeger:4317, which v2 listens on out of
  # the box.
  # ---------------------------------------------------------------------------
  jaeger:
    <<: *restart
    image: jaegertracing/jaeger:2.3.0
    container_name: guva-jaeger
    ports:
      - "16686:16686"   # UI
    volumes:
      - jaeger-data:/tmp
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Prometheus — metrics (§14, §19.9).
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.0.1
    container_name: guva-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
    networks: [guva]

  # ---------------------------------------------------------------------------
  # Grafana — visualisation (§14, §19.9).
  # ---------------------------------------------------------------------------
  grafana:
    <<: *restart
    image: grafana/grafana:12.0.0
    container_name: guva-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/compose/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/compose/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks: [guva]
