# Copy to `docker-compose.override.yml` to layer local-only changes on top
# of docker-compose.yml. The override file is gitignored so you can adjust
# port mappings, mount your own configs, or attach a profiler without
# touching the canonical compose file.
#
# Usage:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   make up

